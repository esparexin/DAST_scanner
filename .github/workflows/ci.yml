name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: Type check
        run: pnpm -r typecheck

      - name: Unit tests
        run: |
          pnpm --filter @securityscan/contracts test
          pnpm --filter @securityscan/shared test
          pnpm --filter @securityscan/scope test
          pnpm --filter @securityscan/scanner-core test
          pnpm --filter @securityscan/finding-engine test
          pnpm --filter @securityscan/evidence-engine test
          pnpm --filter @securityscan/reporting test
          pnpm --filter @securityscan/crawler test
          pnpm --filter @securityscan/openapi test
          pnpm --filter @securityscan/authentication test
          pnpm --filter @securityscan/mutation-engine test
          pnpm --filter @securityscan/risk-engine test
          pnpm --filter @securityscan/graphql test
          pnpm --filter @securityscan/poc-engine test
