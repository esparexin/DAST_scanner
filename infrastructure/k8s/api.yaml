apiVersion: apps/v1
kind: Deployment
metadata:
  name: securityscan-api
  namespace: securityscan
  labels:
    app.kubernetes.io/name: securityscan-api
    app.kubernetes.io/component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: securityscan-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: securityscan-api
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: api
          image: ghcr.io/esparexin/dast_scanner/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: securityscan-config
            - secretRef:
                name: securityscan-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: securityscan-api
  namespace: securityscan
  labels:
    app.kubernetes.io/name: securityscan-api
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
      name: http
  selector:
    app.kubernetes.io/name: securityscan-api
