apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: securityscan-ingress
  namespace: securityscan
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
    - hosts:
        - scanner.example.com
      secretName: securityscan-tls
  rules:
    - host: scanner.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: securityscan-api
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: securityscan-web
                port:
                  number: 3000
